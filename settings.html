<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用空間坪數、使用環境與開放程度，快速設定 VibeSpace 聲學模式">
  <title>空間設定｜VibeSpace</title>
  <link rel="stylesheet" href="assets/css/settings.css?v=homepage-style-2">
</head>
<body>
  <div class="vibe-bg" aria-hidden="true">
    <span class="vibe-glow vibe-glow-a"></span>
    <span class="vibe-glow vibe-glow-b"></span>
    <span class="vibe-glow vibe-glow-c"></span>
  </div>
  <div class="vibe-vignette" aria-hidden="true"></div>
  <div class="vibe-grain" aria-hidden="true"></div>

  <main class="page-shell">
    <nav class="topbar" aria-label="主要導覽">
      <a class="brand" href="index.html" aria-label="回到 VibeSpace 首頁">VibeSpace</a>
      <div class="topbar-links">
        <a href="index.html">播放頁面</a>
        <a href="pricing.html">方案與定價</a>
      </div>
    </nav>

    <header class="hero">
      <p class="eyebrow">ACOUSTIC PROFILE · 01</p>
      <h1>讓聲音，適應你的空間。</h1>
      <p class="lead">不用了解天花板或空調規格，只要描述空間怎麼使用，我們就會建立合適的混音參數。</p>
    </header>

    <form id="space-settings" class="settings-card">
      <fieldset>
        <legend><span>01</span> 空間坪數</legend>
        <p class="field-help">選擇最接近的室內使用面積</p>
        <div class="choices choices-three">
          <label class="choice">
            <input type="radio" name="spaceSize" value="small" required>
            <span><b>小型空間</b><small>10 坪以下</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="spaceSize" value="medium">
            <span><b>中型空間</b><small>10–30 坪</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="spaceSize" value="large">
            <span><b>大型空間</b><small>30 坪以上</small></span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend><span>02</span> 環境</legend>
        <p class="field-help">選擇最接近平常使用情境的場所</p>
        <div class="choices choices-four">
          <label class="choice">
            <input type="radio" name="environment" value="restaurant" required>
            <span><b>餐廳</b><small>人聲、餐具聲較頻繁</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="environment" value="office">
            <span><b>辦公室</b><small>鍵盤、交談與設備聲</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="environment" value="cafe">
            <span><b>咖啡廳</b><small>持續人聲與背景音樂</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="environment" value="classroom">
            <span><b>教室／會議室</b><small>以語音清晰度為主</small></span>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend><span>03</span> 空間類別</legend>
        <p class="field-help">依照牆面、隔間與出入口的開放程度選擇</p>
        <div class="choices choices-three">
          <label class="choice">
            <input type="radio" name="spaceType" value="open" required>
            <span><b>開放</b><small>沒有完整牆面或隔間</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="spaceType" value="semiOpen">
            <span><b>半開放</b><small>有部分隔間或開放出入口</small></span>
          </label>
          <label class="choice">
            <input type="radio" name="spaceType" value="enclosed">
            <span><b>封閉</b><small>完整牆面、門窗與獨立空間</small></span>
          </label>
        </div>
      </fieldset>

      <section class="profile" aria-live="polite">
        <div class="profile-title"><span>預估聲學模式</span><strong id="profile-name">等待設定</strong></div>
        <div class="profile-meter" aria-hidden="true"><i id="profile-meter-fill"></i></div>
        <p id="profile-description">完成三項選擇後，我們會產生你的空間聲學輪廓。</p>
      </section>

      <button class="save-button" type="submit">儲存空間設定 <span aria-hidden="true">→</span></button>
      <p class="save-note">儲存後，這組設定會優先套用到偵測頁面，取代原本的自動空間判斷。</p>
      <p id="save-status" class="save-status" role="status"></p>
    </form>
  </main>

  <script src="assets/js/settings.js?v=simple-profile"></script>
</body>
</html>
