<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/images/vibespace-icon.png" />
  <title>VibeSpace</title>
  <link rel="stylesheet" href="assets/css/main.css?v=diagnostic-card-2" />
</head>
<body>
  <div class="vibe-bg">
    <div class="vibe-glow vibe-glow--a"></div>
    <div class="vibe-glow vibe-glow--b"></div>
    <div class="vibe-glow vibe-glow--c"></div>
  </div>
  <div class="vibe-vignette"></div>
  <div class="vibe-grain"></div>

  <nav class="vibe-nav">
    <a href="index.html" class="vibe-nav__brand">VibeSpace</a>
    <div class="vibe-nav__links">
      <a href="insights.html">品牌聲景</a>
      <a href="pricing.html">方案與定價</a>
      <a href="history.html">我的紀錄</a>
      <button id="logoutBtn" type="button" class="vibe-nav__logout">登出</button>
    </div>
  </nav>

  <main class="vibe-panel">
    <header class="vibe-hero">
      <p class="vibe-eyebrow">Smart Ambient Sound</p>
      <h1 class="vibe-title">VibeSpace</h1>
      <p class="vibe-tagline">讓空間自己找到它的聲音</p>
    </header>

    <button class="vibe-orb" id="vibeToggle" type="button" aria-pressed="false">
      <span class="vibe-orb__ring vibe-orb__ring--outer"></span>
      <span class="vibe-orb__ring vibe-orb__ring--inner"></span>
      <span class="vibe-orb__label" id="vibeLabel">開始</span>
    </button>

    <div class="vibe-meter" aria-hidden="true">
      <span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span>
      <span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span>
      <span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span><span class="vibe-meter__bar"></span>
    </div>

    <p class="vibe-status" id="vibeStatus">尚未啟動</p>

    <dl class="vibe-diagnostics" id="vibeDiagnostics" aria-live="polite">
      <div>
        <dt>目前狀態</dt>
        <dd>
          <span id="vibeDetectedEnergy">Social</span>
          <span id="vibePlayingRow" class="vibe-diagnostics__note" hidden>· 目前仍播放 <span id="vibePlayingEnergy">尚未播放</span></span>
        </dd>
      </div>
      <div id="vibeCandidateRow" hidden><dt>偵測中</dt><dd id="vibeCandidate">尚未偵測</dd></div>
      <div id="vibeConfirmationRow" hidden><dt>確認倒數</dt><dd id="vibeConfirmation">—</dd></div>
    </dl>

    <div class="vibe-track" aria-live="polite">
      <span id="vibeTrack"></span>
      <button id="vibeSkip" type="button" class="vibe-track__skip">下一首 »</button>
    </div>

    <div class="vibe-modes" role="group" aria-label="營運意圖">
      <button type="button" class="vibe-mode" data-vibe-mode="comfort">Comfort</button>
      <button type="button" class="vibe-mode" data-vibe-mode="balanced">Balanced</button>
      <button type="button" class="vibe-mode" data-vibe-mode="flow">Flow</button>
      <button type="button" class="vibe-mode" data-vibe-mode="manual">Manual</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    window.VibeSpaceAuth.requireUser();
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await window.VibeSpaceAuth.signOut();
      window.location.href = "login.html";
    });
  </script>
  <script src="assets/js/context-engine.js?v=candidate-status-1"></script>
  <script src="assets/js/soundscape-player.js?v=classification-diagnostics-1"></script>
  <script src="assets/js/track-selector.js"></script>
  <script src="assets/js/freesound-candidates.js"></script>
  <script src="assets/js/main.js?v=diagnostics-progressive-1"></script>
  <script src="assets/js/session-recorder.js"></script>
</body>
</html>
